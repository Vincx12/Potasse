name: Codacy H1 bounded auth checks

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check account and token routes without valid authentication
        run: curl -fsSL https://raw.githubusercontent.com/Vincx12/Potasse/c090242b4437e9b441009feb1426d9204bc5ea8e/.github/scripts/codacy_account_probe.py | python3
      - name: Check selected administrative reads without valid authentication
        run: curl -fsSL https://raw.githubusercontent.com/Vincx12/Potasse/c090242b4437e9b441009feb1426d9204bc5ea8e/.github/scripts/codacy_admin_probe.py | python3
