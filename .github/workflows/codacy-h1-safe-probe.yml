name: Codacy H1 safe single probe

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Run read-only Codacy authorization controls
        run: python3 .github/scripts/codacy_probe.py
